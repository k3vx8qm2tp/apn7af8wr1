<title>개인 페이지</title>

<style>
:root{--bg:#F6F5F3;--card:#FFFFFF;--ink:#2F2B28;--ink2:#6B6560;--line:#DDD8D2;--btn:#4A4540;--btn-ink:#FFFFFF;--err:#B4453A}
@media (prefers-color-scheme:dark){:root{--bg:#1D1B1A;--card:#272422;--ink:#EEE9E4;--ink2:#B3ABA4;--line:#3D3935;--btn:#D9D2CB;--btn-ink:#1D1B1A;--err:#E58A80}}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif}
.lock{min-height:100%;display:grid;place-items:center;padding:12vh 16px 24px}
.card{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:26px 24px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:20px;font-weight:700}p{margin:0;font-size:13px;color:var(--ink2)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--ink2)}
input[type=password]{border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--card);color:var(--ink);font-size:15px}
label.r{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2)}
button{border:0;border-radius:8px;padding:10px 14px;background:var(--btn);color:var(--btn-ink);font-weight:700;font-size:14px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}.err{color:var(--err);font-size:12.5px;font-weight:600;min-height:1em}
</style></head><body>
